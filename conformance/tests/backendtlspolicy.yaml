apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: normative-test-backendtlspolicy
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: tls-backend
  validation:
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: "ca-certificate"
    hostname: "abc.example.com"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-tls
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace-with-https-listener
  rules:
    - backendRefs:
      - name: tls-backend
        port: 443
      matches:
      - path:
          type: Exact
          value: /backend-tls